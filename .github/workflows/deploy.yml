name: TechStore CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/techstore:latest .

      - name: Push Docker image
        run: docker push ${{secrets.DOCKER_USERNAME}}/techstore:latest

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy TechStore to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/techstore:latest
            sudo docker stop techstore-container || true
            sudo docker rm techstore-container || true
            sudo docker run -d \
              --name techstore-container \
              -p 8080:80 \
              ${{ secrets.DOCKER_USERNAME }}/techstore:latest
            sudo docker image prune -f
